        el("div", {}, `Clean blocks it: ${check.clean_blocks_flow ? "yes" : "no"}. ${check.clean_blocks_note}`),
        el("div", {}, `Own scope reading: ${check.scope_independent}${check.scope_agrees ? " (agrees)" : " (disagrees)"}. ${check.scope_note}`),
        el("div", {}, `Diff minimal: ${check.diff_minimal ? "yes" : "no"}. ${check.diff_note}`),
        el("div", {}, `Class: ${check.class_agrees ? "agrees" : "disagrees"}. ${check.class_note}`),
        el("div", {}, el("b", { text: "Defects" })), list(check.defects, (d) => el("span", { class: "defect " + d.severity }, `[${d.severity}] ${d.issue} → ${d.fix_suggestion}`)),
        el("div", {}, el("b", { text: "Revealing text left" })), list(check.revealing_text_left, (r) => `${r.path}${r.line ? ":" + r.line : ""} ${r.text}`)) : null,
      e.ai?.check && e.ai?.recheck ? el("div", { class: "verdict" }, el("div", { class: "head" }, el("b", { text: "First check (before fix)" }), el("span", { class: "chip ai-bad", text: e.ai.check.verdict })),
        list(e.ai.check.defects, (d) => `[${d.severity}] ${d.issue}`)) : null,
      e.ai?.exclusion ? el("div", { class: "verdict" }, el("div", { class: "head" }, el("b", { text: "Exclusion review" }), el("span", { class: "chip " + (e.ai.exclusion.exclusion_justified ? "ai-bad" : "ai-warn"), text: e.ai.exclusion.exclusion_justified ? "exclusion justified" : "exclusion disputed" })),
        el("p", { text: e.ai.exclusion.note }), e.ai.exclusion.salvage_suggestion ? el("p", {}, el("b", { text: "Salvage: " }), e.ai.exclusion.salvage_suggestion) : null) : null,
    ),
  );

  const failing = (e.checks || []).filter((c) => c.status !== "ok");
  const diffCard = el("section", { class: "card" }, el("h3", { text: "Regression diff (clean → regressed)" }),
    diffView(e.diff),
    el("div", {}, el("b", { text: "Build checks not OK" })), list(failing, (c) => `${c.status.toUpperCase()} ${c.name}: ${c.detail}`),
    el("div", {}, el("b", { text: "Comments stripped as revealing" })), list([...(e.scrubbed?.clean || []), ...(e.scrubbed?.regressed || [])], (s) => `${s.path}:${s.line} (${s.kind}) ${s.text}`),
    el("div", {}, el("b", { text: "String literals with security wording (kept)" })), list([...(e.flagged_strings?.clean || [])], (s) => `${s.path}:${s.line} ${s.text}`),
    ...Object.keys(e.clean_files || {}).map((p) => el("details", {}, el("summary", { text: `Clean slice: ${p}` }), fileView(e.clean_files[p]))),
    ...Object.keys(e.regressed_files || {}).map((p) => el("details", {}, el("summary", { text: `Regressed slice: ${p}` }), fileView(e.regressed_files[p]))),
  );

  box.replaceChildren(summary, flowCard, verdicts, diffCard, decisionPanel(e));
}

function decisionPanel(e) {
  const d = decisionOf(e);
  const writable = !!db;
  const panel = el("section", { class: "decide", "aria-label": "Your decision" });
  const statusText = !writable ? "Decisions can't be saved in this view."
    : d ? `${DECISION_LABEL[d.decision]} on ${new Date(d.decided_at).toLocaleString()}${d.stale ? " — the dossier changed since; review again." : "."}`
    : "Not reviewed yet.";
  const choices = el("div", { class: "choices", role: "group", "aria-label": "Decision" },
    ...[["accept", "Accept as validated"], ["reject", "Reject"], ["revise", "Needs revision"]].map(([key, label]) =>
      el("button", { type: "button", "data-choice": key, "aria-pressed": String(draft.choice === key), disabled: !writable,
        onclick: () => { draft.choice = key; renderDetail(); } , text: label })));
  const note = el("textarea", { id: "note-" + e.event_id, placeholder: "Reason or note (required for Reject and Needs revision)", disabled: !writable });
  note.value = draft.note;
  note.addEventListener("input", () => { draft.note = note.value; save.disabled = !canSave(); });
  const save = el("button", { class: "save", type: "button", text: saving ? "Saving…" : "Save decision", onclick: () => saveDecision(e) });
  const canSave = () => writable && !saving && draft.choice && (draft.choice === "accept" || draft.note.trim().length > 0);
  save.disabled = !canSave();
  const status = el("span", { class: "status", id: "save-status", text: statusText });
  panel.append(el("h3", { text: "Your decision" }), choices, note, el("div", { class: "decide-row" }, status, el("div", { class: "choices" },
    el("button", { type: "button", text: "Next pending →", onclick: nextPending }), save)));
  return panel;
}

async function saveDecision(e) {
  if (!db || saving) return;
  saving = true; renderDetail();
  try {
    await db.collection("decisions").doc(e.event_id).set({
      decision: draft.choice, note: draft.note.trim(), decided_at: new Date().toISOString(),
      dossier: e.dossier_version || null,
    });
    saving = false; renderDetail();
    $("#save-status").textContent = "Saved.";
  } catch (err) {
    saving = false; renderDetail();
    const s = $("#save-status");
    s.classList.add("err");
    s.textContent = err && err.code === "invalid_argument"
      ? "This account can't save decisions here. Only the page's owner signs off."
      : "Couldn't save. Check your connection and try again.";
  }
}

function nextPending() {
  const order = DATA.events;
  const start = Math.max(0, order.findIndex((e) => e.event_id === current));
  for (let i = 1; i <= order.length; i++) {
    const e = order[(start + i) % order.length];
    const d = decisionOf(e);
    if (!d || d.stale) { select(e.event_id, true); return; }
  }
}

function boot() {
  $("#generated").textContent = DATA.generated_at ? `Dossiers built ${DATA.generated_at}` : "";
  renderFilters();
  renderTally();
  select(DATA.events[0]?.event_id, false);
  const use = window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null);
  use.then((handle) => {
    db = handle;
    if (!db) {
      const b = $("#banner"); b.hidden = false;
      b.textContent = "Saving is unavailable in this view. Open the page on claude.ai to record decisions.";
      renderDetail();
      return;
    }
    db.collection("decisions").onSnapshot((snap) => {
      decisions = {};
      for (const doc of snap.docs) decisions[doc.id] = doc.data();
      renderTally(); renderList();
      if (!saving) {
        const d = decisions[current];
        if (d) draft = { choice: d.decision, note: d.note || "" };
        renderDetail();
      }
    }, () => {
      const b = $("#banner"); b.hidden = false;
      b.textContent = "Live updates stopped. Reload the page to keep reviewing.";
    });
  }, () => {});
}
boot();
</script>
